name: Verify & Deploy

# One pipeline. A gate that must hold before anything is published, then the
# deploy, then the rest of the verification as notify-only — a failure there
# reds the run and tells us, but never undoes a deploy that was already green.
#
#   gate ──▶ deploy ──▶ latest-dependencies (notify only)
#
# On a pull request the deploy is skipped and both other jobs still run.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# id-token for the OIDC assume-role; the deploy holds no AWS key, here or anywhere.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.7
  CARGO_LAMBDA_VERSION: 1.9.2
  AWS_REGION: us-east-1
  STACK: seanshubin-com
  RELAY_STACK: liars-dice-relay
  BOOTSTRAP_STACK: liars-dice-bootstrap

jobs:
  gate:
    name: Gate (fmt · clippy · tests · wasm build)
    runs-on: ubuntu-latest

    # The relay's storage tests run against a real DynamoDB rather than a fake of one,
    # because what they check is whether the two trait implementations honour contracts
    # the in-memory ones cannot get wrong. A fake would agree with whatever they did.
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v4

      # `apps/prototype` and `crates/dice-render` are Bevy, which links these natively.
      - name: Install Bevy's Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: gate

      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf - -C /usr/local/bin
          trunk --version

      # Cross-compiling for the Lambda runtime, not for this runner. Ubuntu's glibc
      # is newer than Amazon Linux 2023's, so a native build links against symbols
      # the runtime does not have, and fails at the first invocation rather than at
      # the build. cargo-lambda links with zig against an older glibc, which is the
      # whole reason it is here instead of a plain cargo build. The action rather
      # than a curl, because it installs zig too and zig is the part that matters.
      - uses: cargo-lambda/cargo-lambda-action@v1
        with:
          version: ${{ env.CARGO_LAMBDA_VERSION }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      # What W14 settled: a warning left standing is a deploy that cannot say it
      # passed.
      - name: Clippy, warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings

      # DynamoDB Local has no healthcheck, and a gate that is occasionally red for a
      # reason nobody can reproduce is worse than a gate that waits ten seconds.
      - name: Wait for DynamoDB Local
        run: |
          for _ in $(seq 30); do
            if curl -s -o /dev/null "http://localhost:8000"; then
              echo "listening"
              exit 0
            fi
            sleep 1
          done
          echo "DynamoDB Local never came up"
          exit 1

      # --include-ignored, because the storage tests are ignored by default so that
      # `cargo test` on a machine with no Docker stays green. The gate is where they are
      # not optional. Nothing else in the workspace is ignored, so this adds exactly them.
      - name: Test
        env:
          AWS_ENDPOINT_URL_DYNAMODB: http://localhost:8000
        run: cargo test --workspace -- --include-ignored

      # The zip the deploy publishes is the one the gate built, as with the bundle
      # below. `--output-format zip` produces the single `bootstrap` file the
      # provided runtime execs.
      - name: Build the relay for Lambda
        run: |
          cargo lambda build --release --output-format zip -p relay-service
          ls -l target/lambda/relay-service/bootstrap.zip

      - uses: actions/upload-artifact@v4
        with:
          name: relay
          path: target/lambda/relay-service/bootstrap.zip
          retention-days: 7

      # The bundle the deploy publishes is the one the gate built. Nothing is
      # rebuilt downstream, so nothing downstream can differ.
      - name: Build the hotseat match for the browser
        working-directory: apps/hotseat
        run: trunk build --release --public-url /liars-dice/hotseat/

      - name: Assemble the site
        run: |
          mkdir -p site/liars-dice/hotseat
          cp web/index.html site/index.html
          cp -r apps/hotseat/dist/* site/liars-dice/hotseat/
          find site -type f | sort

      # Nothing is published that cannot be found from the root, and nothing is
      # linked that was not published. Both ship silently otherwise.
      - name: Check every page is reachable from the root
        run: python3 scripts/check-site-links.py site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7

  deploy:
    name: Deploy to seanshubin.com
    needs: gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://seanshubin.com/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/download-artifact@v4
        with:
          name: relay
          path: relay

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update the stack
        run: |
          aws cloudformation deploy \
            --template-file deploy/template.yaml \
            --stack-name "$STACK" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      # The key carries the commit, which is what makes CloudFormation replace the
      # function's code: a redeploy of the same commit is a no-op, and a deploy of
      # a new one cannot be mistaken for it.
      - name: Publish the relay
        run: |
          bucket=$(aws cloudformation describe-stacks --stack-name "$BOOTSTRAP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue" \
            --output text)
          key="relay/${GITHUB_SHA}.zip"
          aws s3 cp relay/bootstrap.zip "s3://${bucket}/${key}"
          aws cloudformation deploy \
            --template-file deploy/relay.yaml \
            --stack-name "$RELAY_STACK" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "ArtifactBucket=${bucket}" "ArtifactKey=${key}"
          aws cloudformation describe-stacks --stack-name "$RELAY_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='SocketUrl'].OutputValue" --output text

      - name: Read the stack's outputs
        id: stack
        run: |
          outputs() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "bucket=$(outputs BucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(outputs DistributionId)" >> "$GITHUB_OUTPUT"

      # Two passes, because the two kinds of file want opposite answers. Assets
      # carry a content hash in their name, so they can never change under a
      # given URL and may be cached for a year. HTML names them, so it must be
      # re-read every time or a deploy would publish assets nobody asks for.
      - name: Sync the content-hashed assets
        run: |
          aws s3 sync site "s3://${{ steps.stack.outputs.bucket }}" \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync the HTML
        run: |
          aws s3 sync site "s3://${{ steps.stack.outputs.bucket }}" \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache"

      - name: Invalidate the edge
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --paths "/*" >/dev/null

      - name: Check what is live
        run: |
          for path in / /liars-dice/hotseat/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://seanshubin.com${path}")
            echo "${path} -> ${code}"
            test "$code" = "200"
          done

  latest-dependencies:
    name: Verify · against the latest dependencies
    needs: [gate, deploy]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest

    # The same container as the gate. An AWS SDK release that breaks the storage would
    # otherwise pass here untested, which is the one thing this job exists to catch.
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy's Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      # D4: checking that an update exists says nothing about whether it works.
      # The gate builds the committed lockfile so a deploy stays reproducible;
      # this throws that lockfile away and tests against the newest everything.
      # A break here reds the run and tells us, and production is untouched.
      - name: Wait for DynamoDB Local
        run: |
          for _ in $(seq 30); do
            if curl -s -o /dev/null "http://localhost:8000"; then
              echo "listening"
              exit 0
            fi
            sleep 1
          done
          echo "DynamoDB Local never came up"
          exit 1

      - name: Update every dependency and test
        env:
          AWS_ENDPOINT_URL_DYNAMODB: http://localhost:8000
        run: |
          cargo update
          cargo test --workspace -- --include-ignored
