[workspace]
resolver = "3"
members = [
    "crates/rules",
    "crates/odds",
    "crates/ai",
    "crates/readout",
    "crates/model",
    "crates/protocol",
    "crates/integrity",
    "crates/relay",
    "crates/render",
    "crates/render-minimal",
    "crates/render-pretty",
    "crates/dice-render",
    "crates/coordinator",
    "apps/web",
    "apps/local",
    "apps/relay",
    "apps/admin",
    "apps/prototype",
    "apps/minimal",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

[workspace.dependencies]
bevy = "0.20"
bevy_egui = "0.43"
sha2 = "0.11.1"
hmac = "0.13.0"
dice-render = { path = "crates/dice-render" }
rules = { path = "crates/rules" }
protocol = { path = "crates/protocol" }
odds = { path = "crates/odds" }
ai = { path = "crates/ai" }
readout = { path = "crates/readout" }
integrity = { path = "crates/integrity" }
render-minimal = { path = "crates/render-minimal" }
