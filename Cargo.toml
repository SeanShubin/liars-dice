[workspace]
resolver = "3"
members = [
    "crates/rules",
    "crates/odds",
    "crates/ai",
    "crates/readout",
    "crates/model",
    "crates/protocol",
    "crates/integrity",
    "crates/relay",
    "crates/wire",
    "crates/seat",
    "crates/table",
    "crates/render",
    "crates/render-minimal",
    "crates/render-pretty",
    "crates/dice-render",
    "crates/coordinator",
    "apps/web",
    "apps/local",
    "apps/relay",
    "apps/probe",
    "apps/admin",
    "apps/prototype",
    "apps/minimal",
    "apps/hotseat",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

[workspace.dependencies]
bevy = "0.20"
bevy_egui = "0.43"
# The presentation crate draws with egui directly, so it depends on no delivery.
# eframe 0.37 resolves the same egui, which is what lets a window and a canvas share it.
egui = "0.37"
# glow alone: wgpu doubles the bundle and brings nothing a two dimensional
# presentation uses. default-features off drops the persistence and accesskit extras.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
sha2 = "0.11.1"
hmac = "0.13.0"
# The relay service only. The library it serves depends on none of this, which is
# what lets a whole match run in a unit test with no AWS and no runtime.
aws-sdk-dynamodb = "1.140.0"
aws-config = "1.13.3"
aws-sdk-apigatewaymanagement = "1.123.0"
aws-sdk-ssm = "1.138.0"
lambda_runtime = "1.5.0"
serde_json = "1.0"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# Only to choose the crypto provider: both aws-lc-rs and ring are in the graph,
# so rustls refuses to guess. The AWS SDK already builds aws-lc-rs.
rustls = "0.23"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
dice-render = { path = "crates/dice-render" }
rules = { path = "crates/rules" }
protocol = { path = "crates/protocol" }
odds = { path = "crates/odds" }
ai = { path = "crates/ai" }
readout = { path = "crates/readout" }
integrity = { path = "crates/integrity" }
coordinator = { path = "crates/coordinator" }
relay = { path = "crates/relay" }
wire = { path = "crates/wire" }
seat = { path = "crates/seat" }
table = { path = "crates/table" }
render-minimal = { path = "crates/render-minimal" }
