[workspace]
resolver = "3"
members = [
    "crates/rules",
    "crates/model",
    "crates/protocol",
    "crates/integrity",
    "crates/render",
    "crates/render-minimal",
    "crates/render-pretty",
    "crates/dice-render",
    "crates/coordinator",
    "apps/web",
    "apps/local",
    "apps/relay",
    "apps/admin",
    "apps/prototype",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

[workspace.dependencies]
bevy = "0.20"
bevy_egui = "0.43"
dice-render = { path = "crates/dice-render" }
