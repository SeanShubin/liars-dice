[package]
name = "auth"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The library is the handler and is tested without a network; the binary is the
# composition root and is the only part that talks to Discord or to SSM.
[lib]
name = "auth"
path = "src/lib.rs"

[[bin]]
name = "auth"
path = "src/main.rs"

[dependencies]
integrity.workspace = true
protocol.workspace = true
serde_json.workspace = true
aws-config.workspace = true
aws-sdk-ssm.workspace = true
lambda_runtime.workspace = true
tokio.workspace = true
reqwest.workspace = true
